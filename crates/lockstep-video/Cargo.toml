[package]
name = "lockstep-video"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Renders Lockstep timing documents as lyric videos"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
